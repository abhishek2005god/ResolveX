services:
  postgres:
    image: postgres:16-alpine
    container_name: resolvex-postgres
    restart: always
    environment:
      POSTGRES_DB: resolvex
      POSTGRES_USER: resolvex_user
      POSTGRES_PASSWORD: resolvex_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resolvex_user -d resolvex"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - resolvex-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resolvex-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8088
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: resolvex
      DB_USER: resolvex_user
      DB_PASSWORD: resolvex_pass
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5173"
      FILE_UPLOAD_DIR: /app/uploads
      GEMINI_API_KEY: ""
    ports:
      - "8088:8088"
    volumes:
      - uploads:/app/uploads
    networks:
      - resolvex-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: resolvex-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - resolvex-net

volumes:
  pgdata:
  uploads:

networks:
  resolvex-net:
    driver: bridge
